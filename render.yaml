services:
  - type: web
    name: wealth-management-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: SECRET_KEY
        value: super-secret-key-for-wealth-management-demo
      - key: ALGORITHM
        value: HS256
      - key: DATABASE_URL
        value: sqlite:///./test.db
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_MINUTES
        value: 1440
